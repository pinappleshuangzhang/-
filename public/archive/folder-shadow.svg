<svg width="748" height="599" viewBox="0 0 748 599" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 仅保留柔和底部投影；去掉贴边硬阴影，避免档案夹四周出现细黑线 -->
  <g opacity="0.22" filter="url(#soft_blur)">
    <ellipse cx="370" cy="530" rx="280" ry="36" fill="#131313"/>
  </g>
  <g opacity="0.18" filter="url(#soft_blur_side)">
    <path d="M662 120L700 145V460H662V120Z" fill="#999999"/>
  </g>
  <defs>
    <filter id="soft_blur" x="50" y="460" width="640" height="140" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft_blur_side" x="640" y="100" width="90" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
</svg>
